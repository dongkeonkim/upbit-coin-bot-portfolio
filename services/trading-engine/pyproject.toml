[project]
name = "trading-engine"
version = "1.0.0"
description = "Trading engine with backtesting and live trading support"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.25.0",
    "kubernetes>=28.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "xgboost>=2.0.0",
    "websockets>=12.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
