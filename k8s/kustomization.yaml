apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coinbot

resources:
  - base/namespace.yaml
  - base/configmap.yaml
  - base/secret.yaml
  - base/trading-engine-rbac.yaml  # Leader Election RBAC
  # ghcr-secret은 kubectl create secret으로 생성됨
  - services/redis.yaml
  - services/asset-service.yaml
  - services/market-data-service.yaml
  - services/trade-service.yaml
  - services/trading-engine.yaml
