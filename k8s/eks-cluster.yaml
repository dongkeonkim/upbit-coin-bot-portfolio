apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: coinbot-cluster
  region: ap-northeast-2

managedNodeGroups:
  - name: spot-nodes
    instanceTypes: ["t3.medium", "t3a.medium"]
    spot: true
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
    labels:
      role: worker
    tags:
      environment: dev
