apiVersion: v1
kind: Secret
metadata:
  name: coinbot-secrets
  namespace: coinbot
  annotations:
    # This secret is managed by GitHub Actions (deploy.yml)
    # Actual values are injected from GitHub Secrets during deployment
    managed-by: "github-actions"
type: Opaque
stringData:
  # Placeholder values - actual values injected by GitHub Actions
  # Required GitHub Secrets:
  #   - UPBIT_ACCESS_KEY
  #   - UPBIT_SECRET_KEY
  #   - SLACK_WEBHOOK_URL
  UPBIT_ACCESS_KEY: "placeholder"
  UPBIT_SECRET_KEY: "placeholder"
  SLACK_WEBHOOK_URL: ""
